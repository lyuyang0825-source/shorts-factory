name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装系统依赖
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::ForceIPv4=true update
            sudo apt-get -o Acquire::ForceIPv4=true install -y --no-install-recommends ffmpeg
          fi
          if ! fc-list 2>/dev/null | grep -qi "Noto Sans CJK"; then
            sudo apt-get -o Acquire::ForceIPv4=true update
            sudo apt-get -o Acquire::ForceIPv4=true install -y --no-install-recommends fonts-noto-cjk
          fi
          pip install pillow
      - name: 单元测试
        run: python3 -m unittest discover -s tests
      - name: 渲染 60 秒 demo
        run: python3 -m shorts_factory.cli --brief samples/brief_zh_01.json --out-dir /tmp/shorts_out --render
